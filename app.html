<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<script>
// ?embed=1: o app roda dentro dos celulares da landing, com a conta de demonstração e sem gravar nada no navegador.
window.EMBED = new URLSearchParams(location.search).has('embed');
if (EMBED) { document.documentElement.classList.add('embed'); try { const mem = {}; Storage.prototype.getItem = function (k) { return k in mem ? mem[k] : null; }; Storage.prototype.setItem = function (k, v) { mem[k] = String(v); }; Storage.prototype.removeItem = function (k) { delete mem[k]; }; } catch (e) {} } // dados só em memória, não mexem no navegador
else { try { if (localStorage.getItem('partiu.modo') === 'celular') document.documentElement.classList.add('phone-mode'); } catch (e) {} }
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Partiu</title>
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="brand/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<meta name="theme-color" content="#111111">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,600;1,700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
<link rel="stylesheet" href="css/base.css?v=93">
<link rel="stylesheet" href="css/screens/onboarding.css?v=93">
<link rel="stylesheet" href="css/screens/quiz.css?v=93">
<link rel="stylesheet" href="css/screens/loading.css?v=93">
<link rel="stylesheet" href="css/screens/plan.css?v=93">
<link rel="stylesheet" href="css/screens/map.css?v=93">
<link rel="stylesheet" href="css/screens/login.css?v=93">
<link rel="stylesheet" href="css/screens/feed.css?v=93">
<link rel="stylesheet" href="css/screens/conta.css?v=93">
<link rel="stylesheet" href="css/pill.css?v=93">
<link rel="stylesheet" href="css/motion.css?v=93">
<link rel="stylesheet" href="css/desktop.css?v=93">
</head>
<body>
<a class="dev-link" href="telas.html">← Todas as telas</a>
<button class="dev-link dev-wx" id="devWx" type="button" aria-label="Mudar o clima (só no desenvolvimento)"></button>
<div class="phone">
  <div class="device-ui" aria-hidden="true"><span>9:41</span><span class="island"></span><span class="sb-icons"><svg width="18" height="12" viewBox="0 0 17 11"><rect x="0" y="7" width="3" height="4" rx="1" fill="currentColor"/><rect x="4.5" y="5" width="3" height="6" rx="1" fill="currentColor"/><rect x="9" y="2.5" width="3" height="8.5" rx="1" fill="currentColor"/><rect x="13.5" y="0" width="3" height="11" rx="1" fill="currentColor"/></svg><svg width="26" height="12" viewBox="0 0 25 12"><rect x=".5" y=".5" width="21" height="11" rx="3" fill="none" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="16" height="8" rx="1.8" fill="currentColor"/><rect x="22.5" y="4" width="1.8" height="4" rx=".9" fill="currentColor" opacity=".45"/></svg></span></div>

  <!-- Login (MVP): redes sociais ou e-mail; conta existente vai para a viagem, conta nova para o cadastro -->
  <section id="login" class="screen" aria-label="Entrar" hidden>
    <div class="lg-hero" id="lgHero">
      <div class="lg-slides" id="lgSlides"></div>
      <div class="lg-top">
        <button class="icon-btn" id="loginBack" aria-label="Voltar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <span class="lg-brand"><img src="brand/pin-branco.svg" alt="" width="22" height="22">Partiu</span>
        <span style="width:44px"></span>
      </div>
    </div>
    <div class="lg-body" id="loginBody"></div>
  </section>

  <!-- Onboarding -->
  <section id="intro" class="screen" aria-label="Apresentação" hidden>
    <div class="intro-top">
      <span class="brand"><img src="brand/pin-branco.svg" alt="" width="26" height="26">Partiu</span>
      <button class="link" id="skip">Pular</button>
    </div>
    <div class="illus" id="illus" aria-hidden="true"></div>
    <div class="intro-text">
      <h1 id="introTitle"></h1>
      <p class="sub" id="introText"></p>
    </div>
    <div class="intro-foot">
      <div class="dots" id="dots" role="group" aria-label="Telas da apresentação"><button aria-label="Tela 1 de 3"><span></span></button><button aria-label="Tela 2 de 3"><span></span></button><button aria-label="Tela 3 de 3"><span></span></button></div>
      <button class="btn-primary" id="introNext">Continuar</button>
    </div>
  </section>

  <!-- Perguntas -->
  <section id="quiz" class="screen" hidden>
    <div class="q-top">
    <header class="q-head">
      <button class="icon-btn" id="qBack" aria-label="Voltar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span id="qStep"></span>
      <button class="link q-skip" id="qSkip">Pular</button>
    </header>
    <div class="progress" id="qProg" role="group" aria-label="Etapas"></div>
    </div>
    <div class="q-body" id="qBody"></div>
    <footer class="q-foot">
      <p id="qNote" hidden></p>
      <button class="btn-primary" id="qNext">Continuar</button>
    </footer>
  </section>

  <!-- Carregando -->
  <section id="loading" class="screen" hidden>
    <div class="load-wrap think">
      <div class="orbit" id="orbit" aria-hidden="true"><svg class="orb-ring" viewBox="0 0 120 120"><circle class="trk" cx="60" cy="60" r="54"/><circle class="arc" id="orbArc" cx="60" cy="60" r="54"/></svg><span class="orb-track t1"></span><span class="orb-track t2"></span><div class="spin" id="orbSpin"></div><span class="core"><img class="pin" src="brand/pin-branco.svg" alt=""><svg class="ok" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></div>
      <div class="load-text" aria-live="polite"><h1 id="loadTitle">Pensando<i class="dots"><b>.</b><b>.</b><b>.</b></i></h1><p id="loadThought"></p></div>
      <div class="load-bar"><i id="loadBar"></i></div>
      <p class="load-meta" id="loadMeta"></p>
    </div>
  </section>

  <!-- Roteiro: 1) escolher lugares por categoria, deslizando  2) organizar na linha do tempo -->
  <section id="plan" class="screen" hidden>
    <header class="plan-head tab-head">
      <div class="tab-title"><h1>Seu <em>roteiro</em></h1></div>
      <span class="ph-acts"><button class="ph-ic ph-edit" id="planTrips" aria-label="Trocar de viagem ou planejar outra"></button></span>
    </header>
    <button class="trip-hero" id="tripHero" aria-label="Trocar de viagem"></button>
    <div class="day-strip" id="dayStrip" role="group" aria-label="Dias da viagem"></div>
    <div class="tray" id="tray" hidden>
      <div class="tray-head"><strong id="trayTitle"></strong><button class="link-sm" id="autoPlace">Organizar automático</button></div>
      <div class="tray-row" id="trayRow"></div>
    </div>
    <div class="tl-head"><strong id="dayTitle"></strong><span class="ph-acts" id="dayCount"></span></div>
    <!-- Suas viagens: trocar a viagem aberta ou começar outra -->
    <div class="when-wrap trips-wrap" id="tripsSheet" hidden>
      <div class="when-panel trips-panel" role="dialog" aria-label="Suas viagens">
        <div class="grabber"></div>
        <div class="sheet-head"><strong>Suas viagens</strong><button class="icon-btn" id="tripsClose" aria-label="Fechar"></button></div>
        <div class="trips-body" id="tripsBody"></div>
      </div>
    </div>
    <div class="tl" id="timeline"></div>
    <!-- Antes de escolher: montar na mão ou usar as recomendações -->
    <div class="choose" id="choose" role="dialog" aria-label="Como montar o roteiro" hidden>
      <header class="choose-head"><button class="icon-btn" id="chooseClose" aria-label="Fechar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
      <div class="choose-body">
        <div class="q-title"><h1>Como montar seu <em>roteiro?</em></h1><p class="sub" id="chooseSub"></p></div>
        <button class="choice" data-choose="auto">
          <img src="img/post3.jpg" alt="">
          <span class="choice-tag">Mais rápido</span>
          <span class="choice-tx"><strong>Usar as recomendações</strong><small>Pronto em 1 toque</small></span>
          <span class="choice-go"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg></span>
        </button>
        <button class="choice" data-choose="manual">
          <img src="img/laranjeiras.jpg" alt="">
          <span class="choice-tx"><strong>Escolher na mão</strong><small>Deslize e escolha</small></span>
          <span class="choice-go"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg></span>
        </button>
      </div>
    </div>

    <!-- Etapa 1: escolher lugares, um por vez -->
    <div class="disc" id="disc" role="dialog" aria-label="Escolher lugares" hidden>
      <header class="disc-head">
        <button class="icon-btn" id="discClose" aria-label="Fechar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        <div class="plan-title"><strong>Escolher lugares</strong><span id="discCount"></span></div>
        <span style="width:44px"></span>
      </header>
      <div class="stages" id="stages" role="group" aria-label="Categorias"></div>
      <div class="stack" id="stack"></div>
      <div class="disc-acts">
        <button class="round-act" id="noAct" aria-label="Pular"></button>
        <button class="round-act sm" id="undoAct" aria-label="Desfazer"></button>
        <button class="round-act ok" id="yesAct" aria-label="Quero ir"></button>
      </div>
      <div class="disc-foot" id="discFoot" hidden><button class="btn-primary" id="goOrganize"></button></div>
    </div>

    <!-- Etapa 2: escolher dia e horário (ou o que fazer num horário livre) -->
    <div class="when-wrap" id="when" hidden>
      <div class="when-panel" role="dialog" aria-label="Organizar">
        <div class="grabber" aria-hidden="true"></div>
        <div class="sheet-head"><strong id="whenTitle"></strong><button class="icon-btn" id="whenClose" aria-label="Fechar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <p class="when-sub" id="whenSub"></p>
        <div class="when-body" id="whenBody"></div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" hidden><span></span><button id="undo">Desfazer</button></div>
  </section>

  <!-- Principal -->
  <section id="main" class="screen" hidden>
    <div class="map-wrap">
      <div id="map" role="region" aria-label="Mapa"></div>
      <div class="rain" id="rain" aria-hidden="true"></div>
      <div class="trip-card">
        <div class="trip-tx"><strong id="tripCity"></strong><span id="tripMeta"></span></div>
        <div class="wx" id="tripWx" role="img"></div>
      </div>
      <div class="map-note" id="mapNote" role="status" hidden></div>
      <button class="fab fab-search" id="openSearch" aria-label="Buscar lugares e empresas"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
      <button class="fab" id="locate" aria-label="Mostrar minha localização"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3L3 10.5l7.5 3 3 7.5z"/></svg></button>
    </div>
    <div class="sheet" id="placesSheet">
      <button class="grabber-btn" id="grabber" aria-label="Expandir ou recolher a lista"><span></span></button>
      <div class="places-head"><div><h2>Roteiro do dia</h2><span id="placesMeta"></span></div><span class="ph-acts" id="placesActs"></span></div>
      <div class="day-strip" id="mapDays" role="group" aria-label="Dias da viagem"></div>
      <div class="list" id="list"></div>
    </div>
    <div class="found" id="found" role="status" hidden></div>

    <!-- Busca de lugares e empresas -->
    <div class="search-view" id="searchView" role="dialog" aria-label="Buscar lugares e empresas" hidden>
      <header class="sv-head">
        <button class="icon-btn" id="searchClose" aria-label="Voltar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <label class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="color:var(--sec)"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="searchInput" type="search" placeholder="Buscar lugares e empresas" autocomplete="off" aria-label="Buscar lugares e empresas"></label>
      </header>
      <div class="chips" id="searchCats" role="group" aria-label="Categorias"></div>
      <div class="sv-list" id="searchList" aria-live="polite"></div>
    </div>
  </section>
  <!-- Feed: o que outros viajantes estão vivendo no litoral -->
  <section id="feed" class="screen" aria-label="Feed" hidden>
    <header class="tab-head feed-head">
      <div class="tab-title"><h1>Feed</h1></div>
      <button class="icon-btn round" id="feedNew" aria-label="Nova publicação"></button>
    </header>
    <div class="feed-scroll" id="feedScroll">
      <div class="stories" id="stories" role="list" aria-label="Destaques"></div>
      <div class="posts" id="posts" aria-live="polite"></div>
    </div>
    <div class="when-wrap compose-wrap" id="compose" hidden>
      <div class="when-panel compose" role="dialog" aria-label="Nova publicação">
        <div class="grabber"></div>
        <div class="sheet-head"><strong>Nova publicação</strong><button class="icon-btn" id="composeClose" aria-label="Fechar"></button></div>
        <div class="compose-body" id="composeBody"></div>
      </div>
    </div>
  </section>

  <!-- Conta: perfil, viagens salvas e ajustes -->
  <section id="conta" class="screen" aria-label="Conta" hidden>
    <div class="conta-scroll" id="contaScroll"></div>
  </section>

  <!-- Perfil: abre tocando no seu nome na Conta; nome, e-mail e ajustes -->
  <section id="perfil" class="screen" aria-label="Seu perfil" hidden>
    <header class="pf-head"><button class="icon-btn" id="perfilBack" aria-label="Voltar para a conta"></button><strong>Seu perfil</strong><span class="pf-sp"></span></header>
    <div class="conta-scroll" id="perfilScroll"></div>
  </section>

  <nav class="tabbar" id="tabbar" aria-label="Navegação" hidden>
    <span class="tab-ind" aria-hidden="true"></span>
    <button data-tab="main"><span class="tab-ic" data-ic="mapa"></span><span class="tab-l">Explorar</span></button>
    <button data-tab="plan"><span class="tab-ic" data-ic="roteiro"></span><span class="tab-l">Roteiro</span></button>
    <button data-tab="feed"><span class="tab-ic" data-ic="feed"></span><span class="tab-l">Feed</span></button>
    <button data-tab="conta"><span class="tab-ic" data-ic="conta"></span><span class="tab-l">Conta</span></button>
  </nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<script src="js/data.js?v=93"></script>
<script src="js/core.js?v=93"></script>
<script src="js/ui/hnav.js?v=93"></script>
<script src="js/screens/intro.js?v=93"></script>
<script src="js/screens/quiz.js?v=93"></script>
<script src="js/screens/loading.js?v=93"></script>
<script src="js/screens/plan.js?v=93"></script>
<script src="js/screens/map.js?v=93"></script>
<script src="js/partners.js?v=93"></script>
<script src="js/trips.js?v=93"></script>
<script src="js/export.js?v=93"></script>
<script src="js/screens/feed.js?v=93"></script>
<script src="js/screens/conta.js?v=93"></script>
<script src="js/screens/login.js?v=93"></script>
<script src="js/main.js?v=93"></script>
<script>window.PHONE_NATIVE = true;</script>
<script src="js/viewmode.js?v=93"></script>
</body>
</html>
