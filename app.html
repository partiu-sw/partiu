<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Partiu</title>
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="brand/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<meta name="theme-color" content="#134A8E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,600;1,700&display=swap">
<link rel="stylesheet" href="css/base.css?v=8">
<link rel="stylesheet" href="css/screens/onboarding.css?v=8">
<link rel="stylesheet" href="css/screens/quiz.css?v=8">
<link rel="stylesheet" href="css/screens/loading.css?v=8">
<link rel="stylesheet" href="css/screens/plan.css?v=8">
<link rel="stylesheet" href="css/screens/map.css?v=8">
<link rel="stylesheet" href="css/screens/login.css?v=8">
<link rel="stylesheet" href="css/screens/home.css?v=8">
<link rel="stylesheet" href="css/motion.css?v=8">
</head>
<body>
<a class="dev-link" href="telas.html">← Todas as telas</a>
<div class="phone">

  <!-- Login (MVP): redes sociais ou e-mail; conta existente vai para a viagem, conta nova para o cadastro -->
  <section id="login" class="screen" aria-label="Entrar" hidden>
    <div class="lg-hero">
      <img src="img/post1.jpg" alt="">
      <div class="lg-top">
        <button class="icon-btn" id="loginBack" aria-label="Voltar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <span class="lg-brand"><img src="brand/icon.svg" alt="" width="22" height="22">Partiu</span>
        <span style="width:44px"></span>
      </div>
      <span class="lg-place"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.1 7-11.5A7 7 0 0 0 5 9.5C5 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Meia Praia, Itapema</span>
    </div>
    <div class="lg-body" id="loginBody"></div>
  </section>

  <!-- Onboarding -->
  <section id="intro" class="screen" aria-label="Apresentação" hidden>
    <div class="intro-top">
      <span class="brand"><img src="brand/icon.svg" alt="" width="26" height="26">Partiu</span>
      <button class="link" id="skip">Pular</button>
    </div>
    <div class="illus" id="illus" aria-hidden="true"></div>
    <div class="intro-text">
      <h1 id="introTitle"></h1>
      <p class="sub" id="introText"></p>
    </div>
    <div class="intro-foot">
      <div class="dots" id="dots" aria-hidden="true"><span></span><span></span><span></span></div>
      <button class="btn-primary" id="introNext">Continuar</button>
    </div>
  </section>

  <!-- Perguntas -->
  <section id="quiz" class="screen" hidden>
    <header class="q-head">
      <button class="icon-btn" id="qBack" aria-label="Voltar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span id="qStep"></span>
      <button class="link q-skip" id="qSkip">Pular</button>
    </header>
    <div class="progress" id="qProg" role="group" aria-label="Etapas"></div>
    <div class="q-body" id="qBody"></div>
    <footer class="q-foot">
      <p id="qNote" hidden></p>
      <button class="btn-primary" id="qNext">Continuar</button>
    </footer>
  </section>

  <!-- Carregando -->
  <section id="loading" class="screen" hidden>
    <div class="load-wrap">
      <div class="load-ring" aria-hidden="true">
        <svg viewBox="0 0 112 112"><circle class="trk" cx="56" cy="56" r="50"/><circle class="arc" id="loadArc" cx="56" cy="56" r="50"/></svg>
        <span id="loadPct">0%</span>
      </div>
      <div class="load-text" aria-live="polite"><h1 id="loadTitle">Montando seu roteiro</h1><p id="loadMeta"></p></div>
      <ul class="load-steps" id="loadSteps"></ul>
    </div>
  </section>

  <!-- Roteiro: 1) escolher lugares por categoria, deslizando  2) organizar na linha do tempo -->
  <section id="plan" class="screen" hidden>
    <header class="plan-head">
      <button class="icon-btn" id="planBack" aria-label="Voltar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="plan-title"><strong>Seu roteiro</strong><span id="planMeta"></span></div>
      <button class="icon-btn" id="planClose" aria-label="Fechar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <div class="day-strip" id="dayStrip" role="group" aria-label="Dias da viagem"></div>
    <div class="tray" id="tray" hidden>
      <div class="tray-head"><strong id="trayTitle"></strong><button class="link-sm" id="autoPlace">Organizar automático</button></div>
      <div class="tray-row" id="trayRow"></div>
    </div>
    <div class="tl-head"><strong id="dayTitle"></strong><span id="dayCount"></span></div>
    <div class="tl" id="timeline"></div>
    <div class="plan-foot">
      <button class="btn-sec" id="openDiscover"></button>
      <button class="btn-primary" id="planGo">Ver no mapa</button>
    </div>

    <!-- Etapa 1: escolher lugares, um por vez -->
    <div class="disc" id="disc" role="dialog" aria-label="Escolher lugares" hidden>
      <header class="disc-head">
        <button class="icon-btn" id="discClose" aria-label="Fechar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        <div class="plan-title"><strong>Escolher lugares</strong><span id="discCount"></span></div>
        <span style="width:44px"></span>
      </header>
      <div class="stages" id="stages" role="group" aria-label="Categorias"></div>
      <div class="stack" id="stack"></div>
      <div class="disc-acts">
        <button class="round-act" id="noAct" aria-label="Pular"></button>
        <button class="round-act sm" id="undoAct" aria-label="Desfazer"></button>
        <button class="round-act ok" id="yesAct" aria-label="Quero ir"></button>
      </div>
      <div class="disc-foot" id="discFoot" hidden><button class="btn-primary" id="goOrganize"></button></div>
    </div>

    <!-- Etapa 2: escolher dia e horário (ou o que fazer num horário livre) -->
    <div class="when-wrap" id="when" hidden>
      <div class="when-panel" role="dialog" aria-label="Organizar">
        <div class="grabber" aria-hidden="true"></div>
        <div class="sheet-head"><strong id="whenTitle"></strong><button class="icon-btn" id="whenClose" aria-label="Fechar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <p class="when-sub" id="whenSub"></p>
        <div class="when-body" id="whenBody"></div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" hidden><span></span><button id="undo">Desfazer</button></div>
  </section>

  <!-- Início: saudação, pergunta, filtros e lugares perto em cartões de foto -->
  <section id="home" class="screen" aria-label="Início" hidden>
    <header class="home-head">
      <span class="home-av" id="homeAv" aria-hidden="true">A</span>
      <span class="home-who"><small id="homeHello">Boa tarde!</small><strong id="homeName">Ana</strong></span>
      <button class="round-white" id="homeBell" aria-label="Notificações: 1 nova"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></button>
    </header>
    <div class="home-q"><h1>O que fazer<br><em>agora?</em></h1><button class="round-brand" id="homeSearch" aria-label="Buscar lugares"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button></div>
    <div class="chips" id="homeCats" role="group" aria-label="Categorias"></div>
    <div class="home-sec"><h2>Perto de você</h2><button id="homeMap">Ver no mapa</button></div>
    <div class="home-stage"><div class="home-stack" id="homeStack"></div></div>
    <div class="home-count"><span id="homeCount"></span><button id="homeNext">Próximo</button></div>
    <nav class="tabbar" aria-label="Navegação">
      <button aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H5.5A1.5 1.5 0 0 1 4 19z"/></svg>Início</button>
      <button id="homeTabMap"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Explorar</button>
      <button id="homeTabPlan"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Roteiro</button>
    </nav>
  </section>

  <!-- Detalhe de um lugar -->
  <section id="detail" class="screen" aria-label="Detalhe do lugar" hidden>
    <div class="dt-hero">
      <img id="dtPhoto" src="img/cafe.jpg" alt="">
      <div class="dt-top"><button class="glass-circ" data-dt="back" aria-label="Voltar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><span class="glass-pill" id="dtRating"></span></div>
      <div class="dt-txt"><span class="dt-place" id="dtPlace"></span><h1 id="dtTitle"></h1><span class="dt-dots" aria-hidden="true"><i></i><i class="on"></i><i></i><i></i></span></div>
      <div class="dt-side">
        <button data-dt="map" aria-label="Ver no mapa"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg></button>
        <button data-dt="share" aria-label="Compartilhar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3L3 10.5l7.5 3 3 7.5z"/></svg></button>
      </div>
    </div>
    <div class="dt-body">
      <div class="dt-chips" id="dtChips"></div>
      <h2>Sobre o lugar</h2>
      <p id="dtAbout"></p>
    </div>
    <div class="dt-foot"><button class="btn-primary" id="dtAdd" data-dt="add">Adicionar ao roteiro</button><button class="dt-chat" data-dt="chat" aria-label="Falar com o lugar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-12.4 7.6L3 20.5l1.4-5A8.5 8.5 0 1 1 21 11.5z"/><path d="M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01"/></svg></button></div>
    <div class="dt-note" id="dtChatNote" role="status" hidden>Mensagem para o lugar chega no lançamento do app.</div>
  </section>

  <!-- Principal -->
  <section id="main" class="screen" hidden>
    <div class="map-wrap">
      <div id="map" role="region" aria-label="Mapa"></div>
      <div class="trip-card">
        <div class="trip-tx"><strong id="tripCity"></strong><span id="tripMeta"></span></div>
        <div class="wx" id="tripWx" role="img"></div>
      </div>
      <div class="map-note" id="mapNote" role="status" hidden></div>
      <button class="fab fab-search" id="openSearch" aria-label="Buscar lugares e empresas"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
      <button class="fab" id="locate" aria-label="Mostrar minha localização"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3L3 10.5l7.5 3 3 7.5z"/></svg></button>
    </div>
    <div class="sheet" id="placesSheet">
      <button class="grabber-btn" id="grabber" aria-label="Expandir ou recolher a lista"><span></span></button>
      <div class="places-head"><div><h2>Seu roteiro</h2><span id="placesMeta"></span></div></div>
      <div class="chips" id="mapDays" role="group" aria-label="Dias da viagem"></div>
      <div class="list" id="list"></div>
      <nav class="tabbar" aria-label="Navegação">
        <button id="tabHome"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H5.5A1.5 1.5 0 0 1 4 19z"/></svg>Início</button>
        <button aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Explorar</button>
        <button id="tabPlan"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Roteiro</button>
      </nav>
    </div>
    <div class="found" id="found" role="status" hidden></div>

    <!-- Busca de lugares e empresas -->
    <div class="search-view" id="searchView" role="dialog" aria-label="Buscar lugares e empresas" hidden>
      <header class="sv-head">
        <button class="icon-btn" id="searchClose" aria-label="Voltar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <label class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="color:var(--sec)"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="searchInput" type="search" placeholder="Buscar lugares e empresas" autocomplete="off" aria-label="Buscar lugares e empresas"></label>
      </header>
      <div class="chips" id="searchCats" role="group" aria-label="Categorias"></div>
      <div class="sv-list" id="searchList" aria-live="polite"></div>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="js/data.js?v=8"></script>
<script src="js/core.js?v=8"></script>
<script src="js/ui/hnav.js?v=8"></script>
<script src="js/screens/intro.js?v=8"></script>
<script src="js/screens/quiz.js?v=8"></script>
<script src="js/screens/loading.js?v=8"></script>
<script src="js/screens/plan.js?v=8"></script>
<script src="js/screens/map.js?v=8"></script>
<script src="js/screens/home.js?v=8"></script>
<script src="js/screens/login.js?v=8"></script>
<script src="js/main.js?v=8"></script>
</body>
</html>
